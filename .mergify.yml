merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

queue_rules:
  - name: default
    batch_size: 1
    # ponytail: above the fleet CI-wait p95 (151 min, 10-09); a lower value dequeued green PRs mid-run (smarty-dev#8527). Lower once queue-draft p95 < 60 min.
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - base = main
      - -draft
      - check-success = smarty-review
      - check-success = smarty-land-ready
      - check-success = smarty-ci
    merge_conditions:
      - check-success = smarty-ci
