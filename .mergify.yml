merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: 30 min
    merge_method: merge
    queue_conditions:
      - -check-failure = review/security  # a failed security verdict refuses admission, label or not
      - base = main
      - -draft
      - check-success = smarty-review
      - check-success = smarty-land-ready
      - check-success = smarty-ci
    merge_conditions:
      - -check-failure = review/security  # a failed security verdict refuses admission, label or not
      - check-success = smarty-ci
